<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Joseki">
  <!-- Same construction as the Clawform mark — accent square, mono glyph — so
       the two read as one family at 16px, where nothing subtler survives. -->
  <rect width="32" height="32" rx="6" fill="#FF9900"></rect>
  <text x="16" y="22.4" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" font-weight="700" letter-spacing="-0.5" fill="#0A0A0B">J</text>
</svg>
